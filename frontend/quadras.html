  <main>
    <div class="titulo-pagina">
      <h1>Quadras em <em>jogo</em></h1>
      <p class="subtitulo">
        Cada quadra pertence a uma arena e tem seu preço por hora — a base do valor das reservas.
      </p>
    </div>

    <div class="filtros" id="filtros" hidden></div>
    <div class="painel-vidro" id="lista"></div>
    <div id="area-form"></div>
  </main>

  <footer>ArenaHub · Flask + SQLite · Controller, Service, Model e Repository</footer>

  <script src="/js/base.js"></script>
  <script>
    // Um ícone em traço por esporte de areia — nunca emoji.
    // A chave é NORMALIZADA (sem acento, sem caixa) porque o banco guarda
    // o que foi enviado: "futevolei" da API e "Futevôlei" do formulário
    // são o mesmo esporte, e os dois precisam achar o mesmo ícone.
    var ICONE_ESPORTE = {
      'futevolei': 'i-futevolei',
      'beach tennis': 'i-beach-tennis',
      'beachtennis': 'i-beach-tennis',
      'volei de praia': 'i-volei',
      'volei': 'i-volei',
      'frescobol': 'i-frescobol'
    };
    var ESPORTES = ['Futevôlei', 'Beach Tennis', 'Vôlei de Praia', 'Frescobol'];
    var arenaFiltro = new URLSearchParams(location.search).get('arena_id') || '';

    function normalizar(texto) {
      return String(texto || '')
        .normalize('NFD').replace(/[̀-ͯ]/g, '')
        .toLowerCase().trim();
    }

    function icoEsporte(nome) {
      return HubUI.ico(ICONE_ESPORTE[normalizar(nome)] || 'i-esporte');
    }

    // Listagem: GET /api/quadras?detalhes=1 ou ?arena_id= (procedures com JOIN)
    async function carregarLista() {
      var lista = document.getElementById('lista');
      try {
        var url = arenaFiltro ? '/api/quadras?arena_id=' + arenaFiltro : '/api/quadras?detalhes=1';
        var quadras = await HubUI.api(url);
        if (!quadras.length) {
          lista.innerHTML = '<p class="vazio">' + HubUI.ico('i-quadra', 'ico-grande') +
            'Nenhuma quadra cadastrada' + (arenaFiltro ? ' nessa arena' : '') + ' ainda.</p>';
          return;
        }
        lista.innerHTML =
          '<table class="tabela-responsiva">' +
            '<thead><tr><th>ID</th><th>Quadra</th><th>Esporte</th><th>Arena</th>' +
            '<th>Preço/hora</th><th><span class="so-leitor">Ações</span></th></tr></thead>' +
            '<tbody>' + quadras.map(function (q) {
              return '<tr>' +
                '<td data-rotulo="ID"><span class="id-pill">' + q.quadra_id + '</span></td>' +
                '<td data-rotulo="Quadra"><span class="celula-titulo">' + HubUI.esc(q.nome) + '</span></td>' +
                '<td data-rotulo="Esporte">' + icoEsporte(q.tipo_esporte) + ' ' +
                  HubUI.esc(q.tipo_esporte) + '</td>' +
                '<td data-rotulo="Arena">' + HubUI.esc(q.nome_arena) +
                  '<div class="celula-apoio">' + HubUI.esc(q.cidade) + '</div></td>' +
                '<td data-rotulo="Preço/hora"><span class="celula-titulo">' + HubUI.moeda(q.preco_hora) +
                  '</span><span class="celula-apoio"> /h</span></td>' +
                '<td data-rotulo="Ações"><div class="acoes">' +
                  '<button class="perigo botao-menor" data-id="' + q.quadra_id + '">' +
                    HubUI.ico('i-lixeira') + 'Excluir</button>' +
                '</div></td>' +
              '</tr>';
            }).join('') + '</tbody>' +
          '</table>';

        lista.querySelectorAll('button.perigo').forEach(function (btn) {
          btn.addEventListener('click', function () {
            HubUI.confirmar({
              titulo: 'Excluir quadra',
              mensagem: 'Quadras com reservas vinculadas são protegidas pelo banco — ' +
                        'cancele as reservas primeiro.',
              botao: 'Sim, excluir',
              tom: 'perigo'
            }, async function () {
              try {
                await HubUI.api('/api/quadras/' + btn.dataset.id, { method: 'DELETE' });
                HubUI.erroTopo('');
                HubUI.toast('Quadra excluída.');
                carregarLista();
              } catch (e) {
                HubUI.toast(e.message, 'erro');
              }
            });
          });
        });
      } catch (e) {
        HubUI.erroTopo(e.message);
      }
    }

    // Filtro por arena + formulário (arenas vêm de GET /api/arenas)
    async function montarFiltroEForm() {
      var arenas = await HubUI.api('/api/arenas');
      var area = document.getElementById('area-form');

      if (arenas.length) {
        var filtros = document.getElementById('filtros');
        filtros.hidden = false;
        filtros.innerHTML =
          '<a href="/quadras" class="' + (!arenaFiltro ? 'ativo' : '') + '">Todas as arenas</a>' +
          arenas.map(function (a) {
            return '<a href="/quadras?arena_id=' + a.arena_id + '" class="' +
              (arenaFiltro === String(a.arena_id) ? 'ativo' : '') + '">' + HubUI.esc(a.nome) + '</a>';
          }).join('');
      } else {
        area.innerHTML =
          '<div class="aviso">' + HubUI.ico('i-alerta', 'ico-grande') +
            '<div>' +
              '<strong>Ainda não dá para cadastrar quadras.</strong>' +
              '<p>Toda quadra pertence a uma arena, e nenhuma arena foi cadastrada até agora.</p>' +
              '<a class="botao-link" href="/arenas">Cadastrar uma arena' + HubUI.ico('i-seta') + '</a>' +
            '</div>' +
          '</div>';
        return;
      }

      area.innerHTML =
        '<form class="painel" id="form-quadra">' +
          '<h2>Cadastrar quadra</h2>' +
          '<div class="erro-form" id="erro-form" hidden></div>' +
          '<label><span class="rotulo">Arena</span>' +
            '<select name="arena_id" required>' +
              '<option value="">Selecione a arena…</option>' +
              arenas.map(function (a) {
                return '<option value="' + a.arena_id + '">' + HubUI.esc(a.nome) + '</option>';
              }).join('') +
            '</select></label>' +
          '<label><span class="rotulo">Nome da quadra</span>' +
            '<input name="nome" placeholder="Quadra Central" required></label>' +
          '<label><span class="rotulo">Esporte</span>' +
            '<select name="tipo_esporte" required>' +
              '<option value="">Selecione o esporte…</option>' +
              ESPORTES.map(function (nome) {
                return '<option value="' + nome + '">' + nome + '</option>';
              }).join('') +
            '</select></label>' +
          '<label><span class="rotulo">Preço por hora (R$)</span>' +
            '<input name="preco_hora" type="number" step="0.01" min="0" placeholder="120.00" required></label>' +
          '<div class="linha-cheia">' +
            '<button type="submit" class="principal">Cadastrar quadra</button></div>' +
        '</form>';

      document.getElementById('form-quadra').addEventListener('submit', async function (e) {
        e.preventDefault();
        var form = this;
        var erroForm = document.getElementById('erro-form');
        var botao = form.querySelector('button[type="submit"]');
        erroForm.hidden = true;
        HubUI.carregando(botao, true);
        try {
          await HubUI.api('/api/quadras', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(Object.fromEntries(new FormData(form)))
          });
          form.reset();
          form.querySelectorAll('select').forEach(function (s) {
            s.dispatchEvent(new Event('change'));
          });
          HubUI.toast('Quadra cadastrada.');
          carregarLista();
        } catch (erro) {
          erroForm.innerHTML = HubUI.ico('i-alerta') + '<span></span>';
          erroForm.querySelector('span').textContent = erro.message;
          erroForm.hidden = false;
        } finally {
          HubUI.carregando(botao, false);
        }
      });

      HubUI.melhorar(area);
    }

    carregarLista();
    montarFiltroEForm().catch(function (e) { HubUI.erroTopo(e.message); });
  </script>
</body>
