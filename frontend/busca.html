  <main>
    <div class="titulo-pagina">
      <h1>Buscar no <em>sistema</em></h1>
      <p class="subtitulo">
        Uma pergunta, três procedures: o termo é procurado em usuários, em arenas
        e em quadras ao mesmo tempo.
      </p>
    </div>

    <form class="painel" id="form-busca">
      <label class="linha-cheia">
        <span class="rotulo">O que você procura</span>
        <input id="termo" name="q" type="search" autocomplete="off"
               placeholder="um nome, um e-mail, uma cidade, um esporte…"
               aria-describedby="ajuda-busca">
        <span class="ajuda" id="ajuda-busca">
          Usuários por nome ou e-mail; arenas por nome, cidade ou endereço;
          quadras por nome, esporte ou arena. O CPF não entra na busca.
        </span>
      </label>
      <div class="linha-cheia">
        <button type="submit" class="principal">Buscar</button>
      </div>
    </form>

    <div id="resultado"></div>
  </main>

  <footer>
    ArenaHub · Flask + SQLite · Controller, Service, Model e Repository ·
    <a href="/termos">Termos e privacidade</a>
  </footer>

  <script src="/js/base.js"></script>
  <script src="/js/interface.js"></script>
  <script src="/js/lgpd.js"></script>
  <script>
    var campo = document.getElementById('termo');
    var area = document.getElementById('resultado');

    var ICONE_TIPO = { atleta: 'i-atleta', dono: 'i-escudo', professor: 'i-formatura' };
    var ICONE_ESPORTE = {
      'futevolei': 'i-futevolei', 'beach tennis': 'i-beach-tennis',
      'beachtennis': 'i-beach-tennis', 'volei de praia': 'i-volei',
      'volei': 'i-volei', 'frescobol': 'i-frescobol'
    };
    function normalizar(t) {
      return String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '')
                            .toLowerCase().trim();
    }

    function painel(titulo, icone, quantos, tabelaHtml) {
      return '<div class="painel-vidro">' +
               '<h2>' + HubUI.ico(icone) + titulo +
                 '<span class="contagem">' + quantos + '</span></h2>' +
               tabelaHtml +
             '</div>';
    }

    function tabela(colunas, linhas) {
      return '<table class="tabela-responsiva"><thead><tr>' +
        colunas.map(function (c) { return '<th>' + c + '</th>'; }).join('') +
        '</tr></thead><tbody>' + linhas + '</tbody></table>';
    }

    function celula(rotulo, conteudo) {
      return '<td data-rotulo="' + rotulo + '">' + conteudo + '</td>';
    }

    function blocoUsuarios(lista) {
      if (!lista.length) return '';
      return painel('Usuários', 'i-usuario', lista.length, tabela(
        ['Nome', 'E-mail', 'Telefone', 'Tipo'],
        lista.map(function (u) {
          return '<tr>' +
            celula('Nome', '<span class="celula-titulo">' + HubUI.esc(u.nome) + '</span>') +
            celula('E-mail', HubUI.esc(u.email)) +
            celula('Telefone', '<span class="mono">' + HubUI.telefone(u.telefone) + '</span>') +
            celula('Tipo', '<span class="selo">' +
              HubUI.ico(ICONE_TIPO[u.tipo_usuario] || 'i-usuario') +
              HubUI.esc(u.tipo_usuario) + '</span>') +
          '</tr>';
        }).join('')
      ));
    }

    function blocoArenas(lista) {
      if (!lista.length) return '';
      return painel('Arenas', 'i-arena', lista.length, tabela(
        ['Arena', 'Cidade', 'Dono', 'Quadras'],
        lista.map(function (a) {
          return '<tr>' +
            celula('Arena', '<span class="celula-titulo">' + HubUI.esc(a.nome) + '</span>' +
              '<div class="celula-apoio">' + HubUI.esc(a.endereco) + '</div>') +
            celula('Cidade', HubUI.ico('i-local') + ' ' + HubUI.esc(a.cidade)) +
            celula('Dono', HubUI.esc(a.nome_dono)) +
            celula('Quadras', '<a href="/quadras?arena_id=' + a.arena_id + '">' +
              a.total_quadras + ' quadra' + (a.total_quadras !== 1 ? 's' : '') + '</a>') +
          '</tr>';
        }).join('')
      ));
    }

    function blocoQuadras(lista) {
      if (!lista.length) return '';
      return painel('Quadras', 'i-quadra', lista.length, tabela(
        ['Quadra', 'Esporte', 'Arena', 'Preço/hora'],
        lista.map(function (q) {
          return '<tr>' +
            celula('Quadra', '<span class="celula-titulo">' + HubUI.esc(q.nome) + '</span>') +
            celula('Esporte', HubUI.ico(ICONE_ESPORTE[normalizar(q.tipo_esporte)] || 'i-esporte') +
              ' ' + HubUI.esc(q.tipo_esporte)) +
            celula('Arena', HubUI.esc(q.nome_arena) +
              '<div class="celula-apoio">' + HubUI.esc(q.cidade) + '</div>') +
            celula('Preço/hora', '<span class="celula-titulo">' +
              HubUI.moeda(q.preco_hora) + '</span><span class="celula-apoio"> /h</span>') +
          '</tr>';
        }).join('')
      ));
    }

    // Busca global: GET /api/busca?q= (três procedures, um Service)
    async function buscar(termo) {
      HubUI.esperando(area, 'tabela', 3);
      try {
        var r = await HubUI.api('/api/busca?q=' + encodeURIComponent(termo));
        if (!r.total) {
          area.innerHTML = '<div class="painel-vidro"><p class="vazio">' +
            HubUI.ico('i-busca-vazia', 'ico-grande') +
            'Nada encontrado para "' + HubUI.esc(r.termo) + '".</p></div>';
          return;
        }
        area.innerHTML =
          '<p class="ajuda">' + r.total + ' resultado' + (r.total !== 1 ? 's' : '') +
            ' para "' + HubUI.esc(r.termo) + '".</p>' +
          blocoUsuarios(r.usuarios) + blocoArenas(r.arenas) + blocoQuadras(r.quadras);
        HubUI.melhorar(area);
      } catch (e) {
        area.innerHTML = '<div class="painel-vidro"><p class="vazio">' +
          HubUI.ico('i-proibido', 'ico-grande') + HubUI.esc(e.message) + '</p></div>';
      }
    }

    function estadoInicial() {
      area.innerHTML = '<div class="painel-vidro"><p class="vazio">' +
        HubUI.ico('i-busca', 'ico-grande') +
        'Digite algo acima para procurar em usuários, arenas e quadras.</p></div>';
    }

    document.getElementById('form-busca').addEventListener('submit', function (e) {
      e.preventDefault();
      var termo = campo.value.trim();
      // O termo vai para a URL: assim o resultado pode ser recarregado,
      // guardado nos favoritos ou colado para outra pessoa.
      var url = termo ? '?q=' + encodeURIComponent(termo) : location.pathname;
      history.replaceState(null, '', url);
      if (!termo) { estadoInicial(); return; }
      buscar(termo);
    });

    var inicial = new URLSearchParams(location.search).get('q') || '';
    if (inicial) {
      campo.value = inicial;
      buscar(inicial);
    } else {
      estadoInicial();
    }
    campo.focus();
    HubUI.melhorar();
  </script>
</body>
</html>
