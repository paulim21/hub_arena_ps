<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hub Arena — Arenas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
  <header>
    <div class="nav-inner">
      <a class="logo" href="/"><span class="bola"></span>HUB<span>ARENA</span></a>
      <nav>
        <a href="/">Visão geral</a>
        <a href="/usuarios">Usuários</a>
        <a href="/arenas" class="ativo">Arenas</a>
        <a href="/quadras">Quadras</a>
        <a href="/reservas">Reservas</a>
        <a href="/relatorios">Relatórios</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="titulo-pagina">
      <div>
        <h1>Arenas <em>parceiras</em></h1>
        <p class="subtitulo">Cada arena pertence a um dono cadastrado e agrupa suas quadras.</p>
      </div>
    </div>

    <div class="painel-vidro" id="lista"></div>
    <div id="area-form"></div>
  </main>

  <footer>HUB ARENA · Flask + SQLite3 + API REST · feito para quem vive o jogo</footer>

  <script src="/js/base.js"></script>
  <script>
    // Listagem: GET /api/arenas?detalhes=1 (procedure sp_arenas_com_dono)
    async function carregarLista() {
      var lista = document.getElementById('lista');
      try {
        var arenas = await HubUI.api('/api/arenas?detalhes=1');
        if (!arenas.length) {
          lista.innerHTML = '<p class="vazio"><span class="icone">🏟️</span>Nenhuma arena cadastrada ainda.</p>';
          return;
        }
        lista.innerHTML = '<table>' +
          '<tr><th>ID</th><th>Arena</th><th>Cidade</th><th>Dono</th><th>Quadras</th><th>Taxa SaaS</th><th>Vencimento</th><th></th></tr>' +
          arenas.map(function (a) {
            return '<tr>' +
              '<td><span class="id-pill">' + a.arena_id + '</span></td>' +
              '<td><strong>' + HubUI.esc(a.nome) + '</strong>' +
                (a.cnpj ? '<div class="mono" style="font-size:11px; color:#5A6175;">CNPJ ' + HubUI.esc(a.cnpj) + '</div>' : '') +
              '</td>' +
              '<td>📍 ' + HubUI.esc(a.cidade) + '</td>' +
              '<td>' + HubUI.esc(a.nome_dono) + '</td>' +
              '<td><a href="/quadras?arena_id=' + a.arena_id + '" style="color:#FFB56B; text-decoration:none; font-weight:700;">' +
                a.total_quadras + ' quadra' + (a.total_quadras !== 1 ? 's' : '') + ' →</a></td>' +
              '<td><strong>' + HubUI.moeda(a.taxa_saas) + '</strong><span style="color:#5A6175; font-size:12px;">/mês</span></td>' +
              '<td>📆 todo dia <strong>' + a.dia_vencimento + '</strong></td>' +
              '<td><div class="acoes">' +
                '<button class="perigo" data-id="' + a.arena_id + '">Excluir</button>' +
              '</div></td>' +
            '</tr>';
          }).join('') +
        '</table>';

        // Exclusão: modal → DELETE /api/arenas/<id>
        lista.querySelectorAll('button.perigo').forEach(function (btn) {
          btn.addEventListener('click', function () {
            HubUI.confirmar({
              titulo: 'Excluir arena',
              mensagem: 'Tem certeza que deseja excluir esta arena? As quadras e reservas ligadas a ela também serão afetadas.',
              botao: 'Sim, excluir'
            }, async function () {
              try {
                await HubUI.api('/api/arenas/' + btn.dataset.id, { method: 'DELETE' });
                HubUI.erroTopo('');
                carregarLista();
              } catch (e) {
                HubUI.erroTopo(e.message);
              }
            });
          });
        });
      } catch (e) {
        HubUI.erroTopo(e.message);
      }
    }

    // Formulário: donos vêm de GET /api/usuarios?tipo=dono (procedure)
    async function montarForm() {
      var area = document.getElementById('area-form');
      var donos = await HubUI.api('/api/usuarios?tipo=dono');

      if (!donos.length) {
        area.innerHTML =
          '<div class="aviso">' +
            '<strong>⚠️ Não é possível cadastrar arenas ainda.</strong>' +
            '<p style="margin-top: 6px;">Toda arena precisa de um responsável do tipo ' +
            '<strong>"Dono de arena"</strong>, e nenhum foi cadastrado até agora.</p>' +
            '<a class="botao-link" href="/usuarios">Cadastrar um dono agora →</a>' +
          '</div>';
        return;
      }

      area.innerHTML =
        '<form class="painel" id="form-arena">' +
          '<h2>➕ Cadastrar arena</h2>' +
          '<div class="erro-form" id="erro-form" style="display:none;"></div>' +
          '<label>Nome da arena<input name="nome" placeholder="Ex: Arena Beira-Mar" required></label>' +
          '<label>CNPJ <span style="text-transform:none; letter-spacing:0; color:#5A6175;">(opcional)</span>' +
            '<input name="cnpj" placeholder="00.000.000/0001-00"></label>' +
          '<label>Endereço<input name="endereco" placeholder="Rua, número e bairro" required></label>' +
          '<label>Cidade<input name="cidade" placeholder="Ex: Betim" required></label>' +
          '<label>Dono da arena<select name="dono_id" required>' +
            '<option value="">Selecione o responsável…</option>' +
            donos.map(function (d) { return '<option value="' + d.usuario_id + '">' + HubUI.esc(d.nome) + '</option>'; }).join('') +
          '</select></label>' +
          '<label>Taxa SaaS (R$/mês)<input name="taxa_saas" type="number" step="0.01" min="0" placeholder="199.90" required></label>' +
          '<label>Dia de vencimento<input name="dia_vencimento" type="number" min="1" max="28" placeholder="Ex: 5 (entre 1 e 28)" required></label>' +
          '<label style="align-self: end; grid-column: 1 / -1;"><button type="submit">Cadastrar arena</button></label>' +
        '</form>';

      // Cadastro: POST /api/arenas com corpo JSON
      document.getElementById('form-arena').addEventListener('submit', async function (e) {
        e.preventDefault();
        var erroForm = document.getElementById('erro-form');
        erroForm.style.display = 'none';
        var dados = Object.fromEntries(new FormData(this));
        try {
          await HubUI.api('/api/arenas', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dados)
          });
          this.reset();
          this.querySelector('select').dispatchEvent(new Event('change'));
          carregarLista();
        } catch (erro) {
          erroForm.textContent = '🚫 ' + erro.message;
          erroForm.style.display = 'block';
        }
      });

      HubUI.melhorar(area);
    }

    carregarLista();
    montarForm().catch(function (e) { HubUI.erroTopo(e.message); });
  </script>
</body>
</html>
