  <main>
    <div class="titulo-pagina">
      <h1>Arenas <em>parceiras</em></h1>
      <p class="subtitulo">Cada arena pertence a um dono cadastrado e agrupa suas quadras.</p>
    </div>

    <div class="painel-vidro" id="lista"></div>
    <div id="area-form"></div>
  </main>

  <footer>
    ArenaHub · Flask + SQLite · Controller, Service, Model e Repository ·
    <a href="/termos">Termos e privacidade</a>
  </footer>

  <script src="/js/base.js"></script>
  <script src="/js/interface.js"></script>
  <script src="/js/lgpd.js"></script>
  <script>
    // Listagem: GET /api/arenas?detalhes=1 (procedure sp_arenas_com_dono)
    async function carregarLista() {
      var lista = document.getElementById('lista');
      HubUI.esperando(lista, 'tabela', 3);
      try {
        var arenas = await HubUI.api('/api/arenas?detalhes=1');
        if (!arenas.length) {
          lista.innerHTML = '<p class="vazio">' + HubUI.ico('i-arena', 'ico-grande') +
                            'Nenhuma arena cadastrada ainda.</p>';
          return;
        }
        lista.innerHTML =
          '<table class="tabela-responsiva">' +
            '<thead><tr><th>ID</th><th>Arena</th><th>Cidade</th><th>Dono</th><th>Quadras</th>' +
            '<th>Taxa SaaS</th><th>Vencimento</th><th><span class="so-leitor">Ações</span></th></tr></thead>' +
            '<tbody>' + arenas.map(function (a) {
              return '<tr>' +
                '<td data-rotulo="ID"><span class="id-pill">' + a.arena_id + '</span></td>' +
                '<td data-rotulo="Arena"><span class="celula-titulo">' + HubUI.esc(a.nome) + '</span>' +
                  (a.cnpj ? '<div class="celula-apoio mono">CNPJ ' + HubUI.cnpj(a.cnpj) + '</div>' : '') +
                '</td>' +
                '<td data-rotulo="Cidade">' + HubUI.ico('i-local') + ' ' + HubUI.esc(a.cidade) + '</td>' +
                '<td data-rotulo="Dono">' + HubUI.ico('i-escudo') + ' ' + HubUI.esc(a.nome_dono) + '</td>' +
                '<td data-rotulo="Quadras">' +
                  '<a href="/quadras?arena_id=' + a.arena_id + '">' + a.total_quadras +
                  ' quadra' + (a.total_quadras !== 1 ? 's' : '') + '</a></td>' +
                '<td data-rotulo="Taxa SaaS"><span class="celula-titulo">' + HubUI.moeda(a.taxa_saas) +
                  '</span><span class="celula-apoio"> /mês</span></td>' +
                '<td data-rotulo="Vencimento">' + HubUI.ico('i-agenda') +
                  ' todo dia <strong>' + a.dia_vencimento + '</strong></td>' +
                '<td data-rotulo="Ações"><div class="acoes">' +
                  '<button class="perigo botao-menor" data-id="' + a.arena_id + '">' +
                    HubUI.ico('i-lixeira') + 'Excluir</button>' +
                '</div></td>' +
              '</tr>';
            }).join('') + '</tbody>' +
          '</table>';

        lista.querySelectorAll('button.perigo').forEach(function (btn) {
          btn.addEventListener('click', function () {
            HubUI.confirmar({
              titulo: 'Excluir arena',
              mensagem: 'Arenas com quadras cadastradas são protegidas pelo banco — ' +
                        'exclua as quadras primeiro.',
              botao: 'Sim, excluir',
              tom: 'perigo'
            }, async function () {
              try {
                await HubUI.api('/api/arenas/' + btn.dataset.id, { method: 'DELETE' });
                HubUI.erroTopo('');
                HubUI.toast('Arena excluída.');
                carregarLista();
              } catch (e) {
                HubUI.toast(e.message, 'erro');
              }
            });
          });
        });
      } catch (e) {
        HubUI.erroTopo(e.message);
      }
    }

    // Formulário: os donos vêm de GET /api/usuarios?tipo=dono (procedure)
    async function montarForm() {
      var area = document.getElementById('area-form');
      var donos = await HubUI.api('/api/usuarios?tipo=dono');

      if (!donos.length) {
        area.innerHTML =
          '<div class="aviso">' + HubUI.ico('i-alerta', 'ico-grande') +
            '<div>' +
              '<strong>Ainda não dá para cadastrar arenas.</strong>' +
              '<p>Toda arena precisa de um responsável do tipo <strong>dono</strong>, ' +
                'e nenhum foi cadastrado até agora.</p>' +
              '<a class="botao-link" href="/usuarios">Cadastrar um dono' + HubUI.ico('i-seta') + '</a>' +
            '</div>' +
          '</div>';
        return;
      }

      area.innerHTML =
        '<form class="painel" id="form-arena">' +
          '<h2>Cadastrar arena</h2>' +
          '<div class="erro-form" id="erro-form" hidden></div>' +
          '<label><span class="rotulo">Nome da arena</span>' +
            '<input name="nome" placeholder="Arena Beira-Mar" required></label>' +
          '<label><span class="rotulo">CNPJ</span>' +
            '<input name="cnpj" data-mascara="cnpj" placeholder="00.000.000/0001-00" ' +
              'autocomplete="off">' +
            '<span class="ajuda">Opcional. Os dígitos verificadores são conferidos.</span></label>' +
          '<label><span class="rotulo">Endereço</span>' +
            '<input name="endereco" placeholder="Rua, número e bairro" required></label>' +
          '<label><span class="rotulo">Cidade</span>' +
            '<input name="cidade" placeholder="Betim" required></label>' +
          '<label><span class="rotulo">Dono da arena</span>' +
            '<select name="dono_id" required>' +
              '<option value="">Selecione o responsável…</option>' +
              donos.map(function (d) {
                return '<option value="' + d.usuario_id + '">' + HubUI.esc(d.nome) + '</option>';
              }).join('') +
            '</select></label>' +
          '<label><span class="rotulo">Taxa SaaS (R$/mês)</span>' +
            '<input name="taxa_saas" type="number" step="0.01" min="0" placeholder="199.90" required></label>' +
          '<label><span class="rotulo">Dia de vencimento</span>' +
            '<input name="dia_vencimento" type="number" min="1" max="28" placeholder="5" required>' +
            '<span class="ajuda">Entre 1 e 28.</span></label>' +
          '<div class="linha-cheia">' +
            '<button type="submit" class="principal">Cadastrar arena</button></div>' +
        '</form>';

      document.getElementById('form-arena').addEventListener('submit', async function (e) {
        e.preventDefault();
        var form = this;
        var erroForm = document.getElementById('erro-form');
        var botao = form.querySelector('button[type="submit"]');
        erroForm.hidden = true;
        HubUI.carregando(botao, true);
        try {
          await HubUI.api('/api/arenas', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(Object.fromEntries(new FormData(form)))
          });
          form.reset();
          form.querySelector('select').dispatchEvent(new Event('change'));
          HubUI.toast('Arena cadastrada.');
          carregarLista();
        } catch (erro) {
          erroForm.innerHTML = HubUI.ico('i-alerta') + '<span></span>';
          erroForm.querySelector('span').textContent = erro.message;
          erroForm.hidden = false;
        } finally {
          HubUI.carregando(botao, false);
        }
      });

      HubUI.melhorar(area);
    }

    carregarLista();
    montarForm().catch(function (e) { HubUI.erroTopo(e.message); });
  </script>
