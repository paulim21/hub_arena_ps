<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>ArenaHub</title>
  <!--
    O monograma AH sobre a faixa de areia. Este arquivo é servido solto
    pelo navegador, fora do CSS, então traz as cores literalmente e o
    próprio prefers-color-scheme — é a única exceção à regra de que
    toda cor nasce no tokens.css.
  -->
  <style>
    .papel { fill: #F4F1EB; }
    .traco { fill: none; stroke: #1B2A4A; stroke-width: 2.4;
             stroke-linecap: round; stroke-linejoin: round; }
    .areia { fill: none; stroke: #EFD6B0; stroke-width: 2.4; stroke-linecap: round; }
    .rede { stroke-width: 1.2; }
    @media (prefers-color-scheme: dark) {
      .papel { fill: #101419; }
      .traco { stroke: #9BB8E8; }
      /* Aqui a areia continua AREIA, e não o --marca-fundo do escuro:
         num ícone de 32px aquele navy profundo sobre o fundo escuro
         apaga a faixa. O favicon é asset solto, não precisa espelhar o
         token — precisa ser visto. */
      .areia { stroke: #EFD6B0; }
    }
  </style>
  <rect class="papel" width="32" height="32" rx="7"/>
  <path class="traco" d="M4.5 23.5 9.5 8l5 15.5"/>
  <path class="traco" d="M6.7 18.5h5.6"/>
  <path class="traco" d="M19.5 8v15.5M27 8v15.5"/>
  <path class="traco rede" d="M19.5 12.8h7.5v5h-7.5z"/>
  <path class="traco rede" d="M23.2 12.8v5M19.5 15.3h7.5"/>
  <path class="areia" d="M4 26.8c7.2 1.9 16.4 1.7 23.6-.3"/>
</svg>
